<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bina.az Modifier</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
            color: #333;
        }

        .status {
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #2e7d32;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1565c0;
        }

        button:active {
            background: #0d47a1;
        }

        .info {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>
    <h1>Bina.az Modifier</h1>

    <div class="status">
        Extension is active
    </div>

    <div class="controls">
        <button id="refreshBtn">Refresh Current Tab</button>
    </div>

    <div class="info">
        This extension modifies HTML content on bina.az
    </div>

    <script src="popup.js"></script>
</body>

</html>
