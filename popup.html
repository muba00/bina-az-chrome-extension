<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bina.az Qiymət Analizatoru</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
            color: #333;
        }

        .status {
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #2e7d32;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1565c0;
        }

        button:active {
            background: #0d47a1;
        }

        .stats-section {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .stats-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-weight: 500;
        }

        .stat-value {
            color: #333;
            font-weight: 600;
        }

        .threshold-group {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #ddd;
        }

        .threshold-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 12px;
        }

        .color-indicator {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .color-good {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .color-average {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }

        .color-expensive {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .threshold-text {
            color: #555;
            flex: 1;
        }

        .no-data {
            color: #999;
            font-size: 13px;
            text-align: center;
            padding: 10px;
        }

        .info {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>
    <h1>Bina.az Qiymət Analizatoru</h1>

    <div class="status">
        Genişləndirmə aktivdir
    </div>

    <div class="controls">
        <button id="refreshBtn">Səhifəni Yenilə</button>
    </div>

    <div class="stats-section">
        <div class="stats-title">📊 Qiymət Analizi</div>
        <div id="statsContent">
            <div class="no-data">Məlumat yoxdur. Statistikanı görmək üçün bina.az elan səhifəsinə daxil olun.</div>
        </div>
    </div>

    <div class="info">
        Bu genişləndirmə bina.az saytında mənzil qiymətlərini analiz edir və kvadrat metr başına qiyməti rəngli
        dərəcələndirmə ilə göstərir.
    </div>

    <script src="popup.js"></script>
</body>

</html>
